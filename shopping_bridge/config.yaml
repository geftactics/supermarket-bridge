name: Shopping Bridge
version: "0.1.3"
slug: shopping_bridge
description: Bridge Home Assistant todo shopping items into a Sainsbury's basket
url: "https://github.com/geftactics/shopping_bridge"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
ports:
  8124/tcp: 8124
map:
  - addon_config:rw
options:
  bridge_dry_run: true
  todo_entity: todo.shopping_list
  sainsburys_email: ""
  sainsburys_password: ""
  sainsburys_store_number: "0560"
  auto_complete_todo: false
  poll_interval_seconds: 30
  preferred_products:
    - term: bananas
      product_ids:
        - "7430790"
        - "1196757"
    - term: bacon
      product_ids:
        - "8123900"
        - "8123902"
        - "7640075"
schema:
  bridge_dry_run: bool
  todo_entity: str
  ha_url: str?
  ha_token: password?
  sainsburys_email: str?
  sainsburys_password: password?
  sainsburys_store_number: str
  auto_complete_todo: bool
  poll_interval_seconds: int
  preferred_products:
    - term: str
      product_ids:
        - str
