name: Supermarket Bridge
version: "0.1.19"
slug: supermarket_bridge
description: Bridge Alexa/Home Assistant shopping list items into a Sainsbury's basket
url: "https://github.com/geftactics/supermarket-bridge"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
ports:
  8124/tcp: 8124
map:
  - addon_config:rw
options:
  todo_entity: todo.shopping_list
  sainsburys_email: ""
  sainsburys_password: ""
  auto_complete_todo: true
  poll_interval_seconds: 30
  failed_retry_seconds: 900
  verbose_logs: false
schema:
  todo_entity: str
  ha_url: str?
  ha_token: password?
  sainsburys_email: str?
  sainsburys_password: password?
  auto_complete_todo: bool
  poll_interval_seconds: int
  failed_retry_seconds: int
  verbose_logs: bool
