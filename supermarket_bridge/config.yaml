name: Supermarket Bridge
version: "0.1.11"
slug: supermarket_bridge
description: Bridge Home Assistant todo shopping items into a Sainsbury's basket
url: "https://github.com/geftactics/supermarket-bridge"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
ports:
  8124/tcp: 8124
map:
  - addon_config:rw
options:
  todo_entity: todo.shopping_list
  sainsburys_email: ""
  sainsburys_password: ""
  sainsburys_session_json: ""
  sainsburys_store_number: "0560"
  auto_complete_todo: true
  poll_interval_seconds: 30
  failed_retry_seconds: 900
  preferred_products:
    - term: bananas
      product_ids:
        - "7430790"
        - "1196757"
    - term: bacon
      product_ids:
        - "8123900"
        - "8123902"
        - "7640075"
schema:
  todo_entity: str
  ha_url: str?
  ha_token: password?
  sainsburys_email: str?
  sainsburys_password: password?
  sainsburys_session_json: password?
  sainsburys_store_number: str
  auto_complete_todo: bool
  poll_interval_seconds: int
  failed_retry_seconds: int
  preferred_products:
    - term: str
      product_ids:
        - str
